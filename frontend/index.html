<!doctype html>
<!-- class="dark" is permanent: QuantDeck's own theme.css is always-dark (not
     OS-dependent), and Tailwind is configured with darkMode: "class" so any
     Tailwind/shadcn component (e.g. components/ui/kinetic-matrix) matches
     that instead of following the visitor's OS light/dark preference. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuantDeck — AI Paper Trading</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
