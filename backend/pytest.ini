[pytest]
# Async tests use pytest-asyncio. "auto" mode treats every coroutine test as an
# asyncio test and runs async fixtures without per-item markers, so the suite
# does not depend on a specific pytest-asyncio strict-mode configuration.
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
